<!doctype html>
<title>Leabharlann</title>
    <link rel="stylesheet" href="/static/site.css">
<body>
<div class="hazard-stripe"></div>
<header>
    <h1><a href="/">Leabharlann</a></h1>
</header>
<main>
    <h1>Works by {{ author }} </h1>
    <div class="container">
    {% for book in works %}
        <div class="book-listing">
        
        {% if book.primary_cover %}
        <img src="{{ book.primary_cover }}" alt="Cover of {{ book.title }}" loading="lazy">
        {% else %}
        <svg width="204" height="204" viewBox="0 0 204 204" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Book cover placeholder">
        <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5b6b8c"/>
            <stop offset="100%" stop-color="#37425c"/>
            </linearGradient>
            <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
            </linearGradient>
        </defs>

        <!-- Background -->
        <rect width="204" height="204" fill="url(#bgGrad)"/>

        <!-- Subtle border -->
        <rect x="1" y="1" width="202" height="202" fill="none" stroke="#000000" stroke-opacity="0.15" stroke-width="2"/>

        <!-- Spine shadow along left edge -->
        <rect x="0" y="0" width="18" height="204" fill="url(#spineShadow)"/>

        <!-- Open book icon -->
        <g transform="translate(102, 108)" opacity="0.92">
            <!-- Left page -->
            <path d="M -46 -30 Q -24 -40 0 -30 L 0 32 Q -24 22 -46 32 Z"
                fill="#f4f1ea" stroke="#c9c3b5" stroke-width="1.5"/>
            <!-- Right page -->
            <path d="M 46 -30 Q 24 -40 0 -30 L 0 32 Q 24 22 46 32 Z"
                fill="#f4f1ea" stroke="#c9c3b5" stroke-width="1.5"/>
            <!-- Center spine line -->
            <line x1="0" y1="-30" x2="0" y2="32" stroke="#b8b2a3" stroke-width="1"/>
        </g>

        <!-- Small decorative title bars near top -->
        <rect x="62" y="34" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.55"/>
        <rect x="76" y="46" width="52" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
        </svg>
        {% endif %}

        <h2><a href="{{ url_for('work', work_key=book.group_key) }}">
            {{ book.title }}
        </a></h2>
    </div>
    {% endfor %}
    </div>
</main>
</body>
